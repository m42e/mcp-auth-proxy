name: Tag Release PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag merged release PR
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(awk '
            /^\[/ { in_pkg = ($0 ~ /^\[package\]([[:space:]]*(#.*)?)?$/) }
            in_pkg && /^version[[:space:]]*=/ {
              sub(/^[^"]*"/, "")
              sub(/".*/, "")
              print
              exit
            }
          ' Cargo.toml)
          if ! printf '%s\n' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid package version in Cargo.toml: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Verify branch name matches version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DETECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXPECTED="release/v${DETECTED_VERSION}"
          if [ "$BRANCH" != "$EXPECTED" ]; then
            echo "::error::Branch name '$BRANCH' does not match expected '$EXPECTED'"
            exit 1
          fi

      - name: Verify tag does not exist
        env:
          DETECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${DETECTED_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Create and push tag
        env:
          DETECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${DETECTED_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Dispatch release workflow
        run: |
          gh workflow run release.yml -f tag="v${DETECTED_VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETECTED_VERSION: ${{ steps.version.outputs.version }}
