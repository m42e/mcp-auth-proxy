name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mcp-auth-proxy
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mcp-auth-proxy.exe
            archive: zip
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: mcp-auth-proxy
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: mcp-auth-proxy
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify tag matches crate version
        shell: bash
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag '$RELEASE_TAG' must match vX.Y.Z"
            exit 1
          fi
          CRATE_VERSION=$(awk '
            /^\[/ { in_pkg = ($0 ~ /^\[package\]([[:space:]]*(#.*)?)?$/) }
            in_pkg && /^version[[:space:]]*=/ {
              sub(/^[^"]*"/, "")
              sub(/".*/, "")
              print
              exit
            }
          ' Cargo.toml)
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Crate version ($CRATE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          ARCHIVE_NAME="mcp-auth-proxy-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C "target/${TARGET}/release" "${BINARY}"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          $archiveName = "mcp-auth-proxy-$($env:RELEASE_TAG)-$($env:TARGET).zip"
          Compress-Archive -Path "target/$($env:TARGET)/release/$($env:BINARY)" -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-auth-proxy-${{ matrix.target }}
          path: ${{ env.ARCHIVE_NAME }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: |
          git-cliff --config .github/cliff.toml --current -o RELEASE_BODY.md

      - name: Create or update GitHub release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_BODY.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_BODY.md \
              dist/*
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
